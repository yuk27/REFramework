name: RE2 AFW build
# Builds only the RE2 (RT / DX12) target of the AFW branch. Personal use.
on:
  push:
    branches: [ "re2-afw", "re2-afw-*" ]
  workflow_dispatch:
env:
  BUILD_TYPE: Release
jobs:
  build-re2:
    runs-on: windows-2022  # windows-latest no longer ships VS 2022
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Output is also echoed as annotations on this run (readable through the API),
      # because the session maintaining this fork can't reach the raw log storage.
      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake -S "${{github.workspace}}" -B "${{github.workspace}}/build" -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/configure.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP/configure.log" | Select-Object -Last 60) -join '%0A'
            Write-Output "::error title=configure failed::$tail"
          }
          exit $code

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build "${{github.workspace}}/build" --config ${{env.BUILD_TYPE}} --target RE2 -- /m /nologo *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errs = @(Select-String -Path "$env:RUNNER_TEMP/build.log" -Pattern '(: error |: fatal error |error MSB|error LNK|CMake Error)' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 40)
            for ($i = 0; $i -lt $errs.Count; $i += 4) {
              $chunk = ($errs[$i..([Math]::Min($i + 3, $errs.Count - 1))]) -join '%0A'
              Write-Output "::error title=build errors $($i + 1)+::$chunk"
            }
            $tail = (Get-Content "$env:RUNNER_TEMP/build.log" | Select-Object -Last 40) -join '%0A'
            Write-Output "::error title=build log tail::$tail"
          }
          exit $code

      - name: Collect files
        shell: pwsh
        run: |
          $out = "${{github.workspace}}/out"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "${{github.workspace}}/build/bin/RE2/dinput8.dll" $out
          Get-ChildItem "${{github.workspace}}/build" -Recurse -Filter dinput8.pdb -ErrorAction SilentlyContinue | Select-Object -First 1 | Copy-Item -Destination $out
          Get-ChildItem "${{github.workspace}}/build/_deps" -Recurse -Filter openxr_loader.dll -ErrorAction SilentlyContinue | Select-Object -First 1 | Copy-Item -Destination $out
          "${{github.sha}}" | Out-File "$out/reframework_revision.txt"
          $files = @(Get-ChildItem $out -File)
          $sums = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content "$out/SHA256SUMS.txt"
          $sums

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: RE2-AFW
          path: ${{github.workspace}}/out/
          if-no-files-found: error
          retention-days: 14
